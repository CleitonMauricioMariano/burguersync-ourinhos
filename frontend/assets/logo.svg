<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Burger Icon Graphic -->
  <g transform="translate(10, 8)">
    <!-- Top Bun -->
    <path d="M4 18 C4 6, 40 6, 40 18 Z" fill="#FF9000" filter="url(#glow-orange)" />
    <!-- Sesame seeds -->
    <circle cx="16" cy="11" r="1.5" fill="#121214" />
    <circle cx="24" cy="9" r="1.5" fill="#121214" />
    <circle cx="30" cy="12" r="1.5" fill="#121214" />
    <!-- Lettuce/Wave -->
    <path d="M3 22 Q10 26 18 22 T33 22 T41 22" stroke="#04D361" stroke-width="3" stroke-linecap="round" filter="url(#glow-green)" />
    <!-- Burger Patty -->
    <rect x="4" y="27" width="36" height="5" rx="2.5" fill="#A8A8B3" />
    <!-- Bottom Bun -->
    <rect x="5" y="34" width="34" height="6" rx="3" fill="#FF9000" filter="url(#glow-orange)" />
  </g>
  <!-- Brand Text -->
  <text x="62" y="32" font-family="'Poppins', sans-serif" font-weight="800" font-size="22" fill="#E1E1E6" letter-spacing="0.5">
    BURGUER<tspan fill="#FF9000" filter="url(#glow-orange)">SYNC</tspan>
  </text>
  <text x="64" y="47" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#04D361" letter-spacing="2">
    OURINHOS • DELIVERY
  </text>
</svg>
